name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No moving v10 major tag is published; pin the full current version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Create virtualenv and install dev dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check scripts examples tests

      - name: Test (pytest)
        run: |
          source .venv/bin/activate
          pytest -q
